version: '3.8'

services:
  user-service:
    build: ./ScalableChatApp-BE/User\ Microservice
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres

  chat-service:
    build: ./ScalableChatApp-BE/Chat\ Microservice
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres

  database-service:
    build: ./ScalableChatApp-BE/Database\ Microservice
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres

  message-service:
    build: ./ScalableChatApp-BE/Message\ Microservice
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres

  socket-service:
    build: ./ScalableChatApp-BE/Socket\ Microservice
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production

  frontend:
    build: ./ScalableChatApp-FE
    ports:
      - "80:80"
    depends_on:
      - user-service
      - chat-service
      - message-service
      - socket-service

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: