version: '3.8'

services:
  user-service:
    image: ${ECR_REGISTRY}/chatapp-user:latest
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: unless-stopped

  chat-service:
    image: ${ECR_REGISTRY}/chatapp-chat:latest
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: unless-stopped

  database-service:
    image: ${ECR_REGISTRY}/chatapp-database:latest
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: unless-stopped

  message-service:
    image: ${ECR_REGISTRY}/chatapp-message:latest
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: unless-stopped

  socket-service:
    image: ${ECR_REGISTRY}/chatapp-socket:latest
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/chatapp-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - user-service
      - chat-service
      - message-service
      - socket-service
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: