groups:
  - name: chat-app-availability
    rules:
      - alert: ChatAppTargetDown
        expr: up{job=~"user-service|chat-service|database-service|message-service|socket-service|postgres|redis|rabbitmq"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for more than one minute."

      - alert: ChatAppDependencyFailure
        expr: increase(chatapp_dependency_operations_total{outcome="failure"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} dependency failure"
          description: "{{ $labels.dependency }} {{ $labels.operation }} operations are failing."

      - alert: ChatAppHighHttpErrorRate
        expr: |
          sum by (service) (rate(chatapp_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum by (service) (rate(chatapp_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate in {{ $labels.service }}"
          description: "More than 5% of requests have returned 5xx responses for five minutes."

      - alert: ChatAppHighHttpLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(chatapp_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency in {{ $labels.service }}"
          description: "The 95th percentile request latency has exceeded one second for five minutes."
