name: Deploy to ECS

on:
  push:
    branches: [master]

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: chatapp-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push all images
        env:
          ECR: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build -f "ScalableChatApp-BE/User Microservice/Dockerfile" \
            -t $ECR/chatapp-user:latest ./ScalableChatApp-BE/
          docker push $ECR/chatapp-user:latest

          docker build -f "ScalableChatApp-BE/Chat Microservice/Dockerfile" \
            -t $ECR/chatapp-chat:latest ./ScalableChatApp-BE/
          docker push $ECR/chatapp-chat:latest

          docker build -f "ScalableChatApp-BE/Database Microservice/Dockerfile" \
            -t $ECR/chatapp-database:latest ./ScalableChatApp-BE/
          docker push $ECR/chatapp-database:latest

          docker build -f "ScalableChatApp-BE/Message Microservice/Dockerfile" \
            -t $ECR/chatapp-message:latest ./ScalableChatApp-BE/
          docker push $ECR/chatapp-message:latest

          docker build -f "ScalableChatApp-BE/Socket Microservice/Dockerfile" \
            -t $ECR/chatapp-socket:latest ./ScalableChatApp-BE/
          docker push $ECR/chatapp-socket:latest

          docker build -t $ECR/chatapp-frontend:latest ./ScalableChatApp-FE/
          docker push $ECR/chatapp-frontend:latest

      - name: Force new ECS deployments
        run: |
          # Fetch actual service names from cluster dynamically
          SERVICES=$(aws ecs list-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query 'serviceArns[]' | tr '\t' '\n' | sed 's|.*/||')

          echo "Found services: $SERVICES"

          for svc in $SERVICES; do
            echo "Deploying $svc..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service $svc \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          done

      - name: Check ECS deployments triggered
        run: |
          echo "ECS deployments triggered successfully"
          echo "Monitor service health in ECS console"
